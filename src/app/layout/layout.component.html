<header class="header">
  <div class="header-inner">
    <a routerLink="/reservas" class="header-brand" (click)="closeMobileMenu()">
      <span class="header-logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="24" height="24" rx="6" fill="var(--color-accent)" />
          <path d="M9 12h10M9 16h7M9 8h4" stroke="#fff" stroke-width="2" stroke-linecap="round" />
        </svg>
      </span>
      <span class="header-name">Reservas</span>
    </a>

    <nav class="header-nav" [class.is-open]="mobileMenuOpen()">
      <a routerLink="/reservas" routerLinkActive="nav-active" class="nav-link" (click)="closeMobileMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Mis reservas
      </a>
      <a routerLink="/reservas/nueva" routerLinkActive="nav-active" class="nav-link" (click)="closeMobileMenu()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nueva reserva
      </a>
    </nav>

    <div class="header-right">
      <div class="user-menu">
        <span class="user-avatar">{{ initials() }}</span>
        <span class="user-name">{{ companyDisplayName() }}</span>
      </div>
      <button type="button" class="btn-logout" (click)="logout()" title="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="btn-logout-label">Salir</span>
      </button>
      <button type="button" class="btn-mobile-menu" (click)="toggleMobileMenu()" aria-label="Menú de navegación">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          @if (!mobileMenuOpen()) {
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          } @else {
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          }
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="main-content">
  <router-outlet />
</main>
